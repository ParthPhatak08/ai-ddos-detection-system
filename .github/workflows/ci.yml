name: AegisNet CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc python3-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Model Artifacts and Architecture
        run: |
          python -c "import joblib, os; assert os.path.exists('model/ddos_random_forest.joblib'), 'Model artifact missing!'; m = joblib.load('model/ddos_random_forest.joblib'); print('[✓] Model loaded successfully with features:', m['feature_columns'])"

      - name: Start Application in Background
        run: |
          python app.py &
          sleep 4

      - name: Run End-to-End API Verification Suite
        run: |
          python verify_api.py
